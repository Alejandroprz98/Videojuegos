<div class="container mt-4">

  <h3 class="text-white mb-3">
    Editar Producto
  </h3>

  <form
    [formGroup]="movieForm"
    (ngSubmit)="updateMovie()"
    class="bg-light p-4 rounded"
  >

    <div class="mb-3">
      <label class="form-label">Nombre</label>

      <input
        type="text"
        class="form-control"
        formControlName="titulo"
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Descripción</label>

      <textarea
        class="form-control"
        rows="3"
        formControlName="sinopsis"
      ></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Precio</label>

      <input
        type="number"
        class="form-control"
        formControlName="anio"
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Imagen</label>

      <input
        type="text"
        class="form-control"
        formControlName="cover"
      />
    </div>

    <button
      type="submit"
      class="btn btn-warning"
    >
      Actualizar
    </button>

    <a
      routerLink="/movies"
      class="btn btn-secondary ms-2"
    >
      Cancelar
    </a>

  </form>

</div>
