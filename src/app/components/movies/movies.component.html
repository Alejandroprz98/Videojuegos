<div *ngIf="!movies || movies.length === 0" class="text-center text-light mt-4">
  <p>Cargando videojuegos...</p>
</div>

<div class="container">

  <div class="d-flex justify-content-between align-items-center mt-4 mb-3">
    <h3 class="text-white">Videojuegos disponibles</h3>

    <a routerLink="/movies/add" class="btn btn-success">
      ➕ Agregar Videojuego
    </a>
  </div>

  <table class="table table-bordered table-striped bg-light mt-3 mb-5">

    <thead class="table-dark">
      <tr>
        <th>Título</th>
        <th>Sinopsis</th>
        <th>Año</th>
        <th>Cover</th>
        <th>Ver</th>
        <th>Editar</th>
        <th>Eliminar</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let movie of movies">

        <!-- TÍTULO -->
        <td>{{ movie.titulo || 'Sin título' }}</td>

        <!-- SINOPSIS -->
        <td>{{ movie.sinopsis || 'Sin sinopsis' }}</td>

        <!-- AÑO -->
        <td>{{ movie.anio || '---' }}</td>

        <!-- COVER -->
        <td>
          <img *ngIf="movie.cover"
               [src]="movie.cover"
               alt="cover"
               style="width:80px; height:60px; object-fit:cover;">
        </td>

        <!-- VER DETALLES -->
        <td>
          <a [routerLink]="['/movies', movie._id]" class="btn btn-primary btn-sm">
            👁️ Ver
          </a>
        </td>

        <!-- EDITAR -->
        <td>
          <a [routerLink]="['/movies/edit', movie._id]" class="btn btn-warning btn-sm">
            ✏️ Editar
          </a>
        </td>

        <!-- ELIMINAR -->
        <td>
          <button (click)="deleteMovie(movie._id)" class="btn btn-danger btn-sm">
            🗑️ Eliminar
          </button>
        </td>

      </tr>

    </tbody>

  </table>

</div>
